<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тренер — концепция UI</title><style>body{margin:0;background:#e9e9e6}[hidden]{display:none!important}</style><div id="trener-concept" class="viz-dotted-background">
<div class="tc-picker" aria-label="Экраны макета"><button data-screen="today" aria-pressed="true">Сегодня</button><button data-screen="workout" aria-pressed="false">Тренировка</button><button data-screen="progress" aria-pressed="false">Прогресс</button><button data-screen="more" aria-pressed="false">Ещё</button><button data-screen="finish" aria-pressed="false">Итог</button></div>
<div class="tc-phone" aria-label="Концепция интерфейса Тренер">
<header class="tc-status"><span>9:41</span><span>Тренер · концепция</span><i data-lucide="battery-full" aria-hidden="true"></i></header>
<div class="tc-content" aria-live="polite"></div>
<nav class="tc-nav" aria-label="Навигация макета"><button data-screen="today"><i data-lucide="calendar-days"></i>Сегодня</button><button data-screen="program"><i data-lucide="dumbbell"></i>Программа</button><button data-screen="progress"><i data-lucide="chart-no-axes-combined"></i>Прогресс</button><button data-screen="awards"><i data-lucide="trophy"></i>Награды</button><button data-screen="more"><i data-lucide="ellipsis"></i>Ещё</button></nav>
</div>
</div>
<style>
#trener-concept{--tc-bg:#101214;--tc-panel:#1a1d21;--tc-raised:#24282d;--tc-text:#f3f4f5;--tc-muted:#a9afb8;--tc-line:#343a42;--tc-gold:#e7c36b;--tc-ink:#17150f;padding:16px 8px 24px;font-family:Manrope,system-ui,sans-serif}
#trener-concept *{box-sizing:border-box}#trener-concept button{font:inherit;cursor:var(--cursor-interaction,pointer)}
#trener-concept .tc-picker{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 auto 18px;padding-right:70px}
#trener-concept .tc-picker button{background:var(--tc-panel);color:var(--tc-text);border:1px solid var(--tc-line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:13px}
#trener-concept .tc-picker button[aria-pressed=true]{color:var(--tc-ink);background:var(--tc-gold)}
#trener-concept .tc-phone{max-width:375px;margin:auto;background:var(--tc-bg);color:var(--tc-text);border:1px solid var(--tc-line);border-radius:28px;overflow:hidden}
#trener-concept .tc-status{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;font-size:12px;font-weight:600;color:var(--tc-muted)}
#trener-concept .tc-status i{width:18px}#trener-concept .tc-content{padding:16px;min-height:644px;display:flex;flex-direction:column;gap:18px}
#trener-concept h2{font-size:28px;font-weight:650;line-height:1.15;margin:0;letter-spacing:-1px;color:var(--tc-text)}
#trener-concept h3{font-size:21px;line-height:1.3;margin:0;font-weight:600;color:var(--tc-text)}
#trener-concept p{margin:0;font-size:14px;line-height:1.5}#trener-concept .tc-muted{color:var(--tc-muted);font-size:13px}
#trener-concept .tc-eyebrow{font-size:12px;letter-spacing:1px;color:var(--tc-muted);margin-bottom:7px}
#trener-concept .tc-panel{background:var(--tc-panel);padding:18px;border-radius:20px}
#trener-concept .tc-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
#trener-concept .tc-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
#trener-concept .tc-day{text-align:center;padding:9px 0;border-radius:12px;font-size:13px;color:var(--tc-muted)}
#trener-concept .tc-day b{display:block;margin-top:8px;color:var(--tc-text);font-size:16px}#trener-concept .tc-day.on{background:var(--tc-gold);color:var(--tc-ink)}#trener-concept .tc-day.on b{color:var(--tc-ink)}
#trener-concept .tc-list{list-style:none;padding:0;margin:12px 0 0}#trener-concept .tc-list li{padding:14px 0;border-bottom:1px solid var(--tc-line);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;line-height:1.35}#trener-concept .tc-list li:last-child{border:0}#trener-concept .tc-list small{display:block;color:var(--tc-muted);font-size:13px;margin-top:5px}#trener-concept .tc-list strong{font-size:14px;white-space:nowrap;font-weight:500}
#trener-concept .tc-primary{min-height:56px;width:100%;border:0;border-radius:15px;background:var(--tc-gold);color:var(--tc-ink);font-size:16px;font-weight:650;padding:14px}
#trener-concept .tc-secondary{min-height:44px;border:0;background:var(--tc-raised);color:var(--tc-text);border-radius:12px;padding:10px 14px}
#trener-concept .tc-bottom{margin-top:auto}#trener-concept .tc-nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--tc-line);padding:8px 4px 14px;background:var(--tc-bg)}
#trener-concept .tc-nav button{border:0;background:transparent;color:var(--tc-muted);display:flex;align-items:center;flex-direction:column;gap:6px;min-height:52px;padding:6px 0;font-size:10px}#trener-concept .tc-nav button[aria-current=page]{color:var(--tc-gold)}#trener-concept .tc-nav svg{width:22px;height:22px}
#trener-concept .tc-target{font-size:30px;font-weight:600;margin:10px 0;color:var(--tc-gold);font-variant-numeric:tabular-nums}
#trener-concept .tc-sets{display:flex;gap:8px}#trener-concept .tc-set{padding:10px 12px;background:var(--tc-raised);border-radius:10px;font-size:13px}#trener-concept .tc-set.done{color:var(--tc-gold)}
#trener-concept .tc-field{display:grid;grid-template-columns:1fr 44px 76px 44px;gap:6px;align-items:center;margin:14px 0}#trener-concept .tc-field label{font-size:14px;color:var(--tc-muted)}#trener-concept .tc-field button{height:48px;background:var(--tc-raised);color:var(--tc-text);border:0;border-radius:10px;font-size:24px}#trener-concept input{min-width:0;width:100%;height:52px;background:var(--tc-bg);color:var(--tc-text);border:1px solid var(--tc-line);border-radius:10px;text-align:center;font:600 24px system-ui}
#trener-concept details{border-top:1px solid var(--tc-line);font-size:14px}#trener-concept summary{min-height:48px;display:flex;align-items:center;justify-content:space-between;cursor:var(--cursor-interaction,pointer)}#trener-concept details p{padding-bottom:16px;color:var(--tc-muted)}
#trener-concept .tc-stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:22px}#trener-concept .tc-stat b{display:block;font-size:23px;line-height:1.5;font-weight:600}#trener-concept .tc-stat small{font-size:12px;color:var(--tc-muted)}#trener-concept .tc-check{font-size:44px;color:var(--tc-gold);padding:28px 0 16px}#trener-concept .tc-track{display:flex;gap:5px}#trener-concept .tc-track span{height:4px;background:var(--tc-line);flex:1;border-radius:3px}#trener-concept .tc-track span.on{background:var(--tc-gold)}
</style>
<script>
(()=>{const root=document.getElementById('trener-concept');const content=root.querySelector('.tc-content');const nav=root.querySelector('.tc-nav');let screen='today';
const list=(rows)=>'<ul class="tc-list">'+rows.map(r=>'<li><div>'+r[0]+'<small>'+r[1]+'</small></div><strong>'+r[2]+'</strong></li>').join('')+'</ul>';
const action=(label,to)=>'<button class="tc-primary" data-screen="'+to+'">'+label+'</button>';
const views={
today:()=>'<div><div class="tc-eyebrow">СУББОТА, 31 ОКТЯБРЯ</div><h2>Сегодня</h2></div><div class="tc-week">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d,i)=>'<div class="tc-day '+(i===5?'on':'')+'">'+d+'<b>'+[26,27,28,29,30,31,1][i]+'</b></div>').join('')+'</div><div class="tc-panel"><div class="tc-row"><h3>Ноги</h3><span class="tc-muted">≈ 63 мин</span></div><p class="tc-muted" style="margin-top:8px">6 упражнений · план на сегодня</p>'+list([['Присед в рычажном тренажёре','4 подхода · 8–12 повторов',''],['Румынская тяга со штангой','3 подхода · 8–12 повторов',''],['Жим ногами','3 подхода · 10–12 повторов','']])+'<details><summary>Остальные 3 упражнения <span>+</span></summary><p>Сгибание ног лёжа · Разгибание ног сидя · Подъём на носки в тренажёре</p></details></div><div class="tc-bottom"><p class="tc-muted" style="margin-bottom:12px">Веса подберёшь по ходу тренировки.</p>'+action('Начать тренировку','workout')+'</div>',
workout:()=>'<div class="tc-row"><button class="tc-secondary" data-screen="today" aria-label="Назад">‹</button><span class="tc-muted">Ноги · 3 из 6</span><button class="tc-secondary" data-screen="finish">Завершить</button></div><div class="tc-track">'+[0,1,2,3,4,5].map(i=>'<span class="'+(i<3?'on':'')+'"></span>').join('')+'</div><div><div class="tc-eyebrow">ТЕКУЩЕЕ УПРАЖНЕНИЕ</div><h2>Жим ногами</h2><div class="tc-target">3 × 10–12</div><p class="tc-muted">План: 80 кг · общий вес</p></div><div class="tc-sets"><span class="tc-set done">✓ 80 × 12</span><span class="tc-set">2-й подход</span><span class="tc-set">3-й</span></div><div class="tc-panel"><div class="tc-row"><h3>Подход 2 из 3</h3></div><div class="tc-field"><label for="tc-kg">Вес, кг</label><button data-step="-5" data-field="tc-kg" aria-label="Уменьшить вес">−</button><input id="tc-kg" inputmode="decimal" value="80"><button data-step="5" data-field="tc-kg" aria-label="Увеличить вес">+</button></div><div class="tc-field"><label for="tc-reps">Повторы</label><button data-step="-1" data-field="tc-reps" aria-label="Уменьшить повторы">−</button><input id="tc-reps" inputmode="numeric" value="12"><button data-step="1" data-field="tc-reps" aria-label="Увеличить повторы">+</button></div><p class="tc-muted">Прошлый раз: 80 × 12 · 80 × 11 · 80 × 10</p></div><div><details><summary>Как делать <span>+</span></summary><p>Здесь остаются существующие подсказки, фотографии и техника упражнения.</p></details><details><summary>Заметки и действия <span>+</span></summary><p>Заметка, разминка, режим веса, замена и отмена — все функции сохраняются.</p></details></div><div class="tc-bottom"><button class="tc-primary" id="tc-log">Записать подход</button><p id="tc-feedback" class="tc-muted" style="text-align:center;margin-top:10px">Демонстрация · данные не сохраняются</p></div>',
finish:()=>'<div class="tc-bottom tc-panel" style="text-align:center"><div class="tc-check">✓</div><div class="tc-eyebrow">ГОТОВО</div><h2>Тренировка записана</h2><div class="tc-stat"><div><b>58</b><small>минут</small></div><div><b>21</b><small>подход</small></div><div><b>6 240</b><small>кг поднято</small></div></div><p class="tc-muted" style="margin:22px 0">+8% к прошлому разу</p><div style="text-align:left">'+list([['Новый рекорд','Жим ногами · 80 кг × 12','★']])+'</div><div style="margin-top:22px">'+action('Отлично','today')+'</div></div>',
progress:()=>'<div><div class="tc-eyebrow">ТВОЙ ДНЕВНИК</div><h2>Прогресс</h2></div><div class="tc-panel"><h3>Первые результаты впереди</h3><p class="tc-muted" style="margin-top:12px">Графики появятся после первых тренировок.</p></div><details><summary>Нагрузка и восстановление <span>+</span></summary><p>Оценка появится после 4 тренировок.</p></details><details><summary>Итоги и рекорды <span>+</span></summary><p>Все существующие показатели остаются в этом разделе.</p></details><div class="tc-bottom">'+action('К тренировке на сегодня','today')+'</div>',
more:()=>'<div><div class="tc-eyebrow">ПОД СЕБЯ</div><h2>Ещё</h2></div><div class="tc-panel"><div class="tc-row"><span>Вес тела</span><span class="tc-muted">Не указан</span></div></div><div><div class="tc-eyebrow">ПРИЛОЖЕНИЕ</div>'+['Расписание и программа','Оформление','Звук отдыха'].map(x=>'<details><summary>'+x+'<span>+</span></summary><p>Существующие настройки раздела.</p></details>').join('')+'</div><div><div class="tc-eyebrow">ДАННЫЕ И ПОДКЛЮЧЕНИЯ</div>'+['Часы · Health Connect','Бэкап и копии'].map(x=>'<details><summary>'+x+'<span>+</span></summary><p>Существующие настройки раздела.</p></details>').join('')+'</div><button class="tc-secondary">Проверить обновление</button><p class="tc-muted" style="text-align:center">Тренер · концепция оформления</p>',
program:()=>'<h2>Программа</h2>'+list([['Пн · Грудь, трицепс, пресс','9 упражнений · ≈ 67 мин','›'],['Вт · Спина, бицепс, трапеции','7 упражнений · ≈ 67 мин','›'],['Чт · Плечи и руки','8 упражнений · ≈ 58 мин','›'],['Пт · Верх','7 упражнений · ≈ 65 мин','›'],['Сб · Ноги','6 упражнений · ≈ 63 мин','›']]),
awards:()=>'<h2>Награды</h2><p class="tc-muted">0 из 50 открыто</p>'+list([['Первый шаг','Первая тренировка','0%'],['Десятка','10 тренировок','0%'],['Полтинник','50 тренировок','0%']])+'<p class="tc-muted">В макете показан фрагмент списка.</p>'};
function render(){content.innerHTML=views[screen]();nav.hidden=screen==='workout'||screen==='finish';root.querySelectorAll('.tc-picker button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.screen===screen));root.querySelectorAll('.tc-nav button').forEach(b=>{if(b.dataset.screen===screen)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(globalThis.lucide)lucide.createIcons();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen){screen=b.dataset.screen;render()}if(b.dataset.step){const f=root.querySelector('#'+b.dataset.field);f.value=Math.max(0,(parseFloat(f.value)||0)+Number(b.dataset.step))}if(b.id==='tc-log'){root.querySelector('#tc-feedback').textContent='Пример: подход записан · отдых 1:30';b.textContent='Подход записан ✓'}});render();
const appearance={light:false,accent:'#e7c36b'};function apply(){root.style.setProperty('--tc-gold',appearance.accent);const p=appearance.light?['#f4f3ef','#ffffff','#eeede8','#181b20','#626972','#d6d7d3']:['#101214','#1a1d21','#24282d','#f3f4f5','#a9afb8','#343a42'];['bg','panel','raised','text','muted','line'].forEach((k,i)=>root.style.setProperty('--tc-'+k,p[i]));}if(globalThis.Tweak){const t=new Tweak({container:root,onChange:apply});t.addToggle(appearance,'light',{label:'Светлая тема'});t.addColorPicker(appearance,'accent',{label:'Акцент',reference:'--tc-gold'});}
})();
</script>
</html>
